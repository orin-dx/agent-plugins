name: Bug report
description: Something in a plugin, agent, or schema isn't working as documented
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Plugin / agent / skill involved
      placeholder: e.g. canon/draft-spec, changeset-analyzer, shared/schemas/changeset@2.json
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: plugin.json version, or the git tag/commit you're on
    validations:
      required: false
